[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.lints.rust]
# `deny` (not `forbid`) so a narrowly-scoped `#[allow(unsafe_code)]` can opt in
# at a specific call site (e.g. shim's `libc::getppid()` per Story 5.3). The
# project-context.md crate-wide invariant calls for `deny`; `forbid` was
# stricter than spec and prevented Story 5.3's PID injection.
unsafe_code = "deny"

[workspace.dependencies]
# Protocol deps
serde       = { version = "1.0.228", features = ["derive"] }
serde_json  = "1.0.149"
thiserror   = "2.0.18"
# Daemon deps
tokio            = { version = "1.52.1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs"] }
axum             = { version = "0.8.9", features = ["ws"] }
rusqlite         = { version = "0.38.0", features = ["bundled", "backup", "blob"] }
deadpool-sqlite  = "0.13.0"
tower-http       = { version = "0.6.10", features = ["request-id", "trace", "timeout", "limit", "util"] }
tokio-tungstenite = "0.27"
tracing          = "0.1.44"
tracing-subscriber = "0.3.20"
anyhow           = "1.0.102"
uuid             = { version = "1.23.1", features = ["v4"] }
rusqlite_migration = "2.4.1"
tokio-util       = "0.7.18"
tokio-stream     = "0.1.17"
clap             = { version = "4.5.37", features = ["derive"] }
secrecy          = "0.10.3"
subtle           = "2.6"
tempfile         = "3.20.0"
assert_cmd       = "2.0.17"
nix              = { version = "0.30", default-features = false, features = ["signal", "fs"] }
tower            = "0.5.3"
toml             = { version = "0.8", default-features = false, features = ["parse"] }
keyring          = { version = "3.6", default-features = false, features = ["apple-native", "sync-secret-service", "linux-native-sync-persistent", "vendored"] }
libc             = "0.2.186"

[profile.release-shim]
inherits      = "release"
panic         = "abort"
lto           = "fat"
codegen-units = 1
opt-level     = "z"
strip         = true

[package]
name    = "bowerbird"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"

[[bin]]
name = "bowerbird"
path = "src/main.rs"

[dependencies]
clap           = { workspace = true }
anyhow         = { workspace = true }
libc           = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
secrecy        = { workspace = true }
keyring        = { workspace = true }
toml           = { workspace = true }
protocol       = { path = "crates/protocol" }
adapter-claude = { path = "crates/adapter-claude" }

[dev-dependencies]
assert_cmd = { workspace = true }
tempfile   = { workspace = true }
serde_json = { workspace = true }
pretty_assertions = "1.4"
# Story 4.4 / AC #5 — `tests/cross_version_upgrade.rs` needs to send SIGTERM
# to spawned daemon subprocesses (nix) and inspect the SQLite file across the
# vN → vN+1 boundary (rusqlite). Both already vendored at the workspace
# level; this entry just exposes them to workspace-root tests.
nix      = { workspace = true }
rusqlite = { workspace = true }
