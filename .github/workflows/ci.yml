name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.6'
      - name: Verify Node version (>=22.6 required for --experimental-strip-types)
        shell: bash
        run: node --version | grep -E '^v22\.[6-9]|^v22\.[1-9][0-9]+|^v2[3-9]|^v[3-9]'
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --workspace -- -D warnings
      - name: Lint - connection factory enforcement
        shell: bash
        run: ./scripts/lint-connection-factory.sh
      - name: Lint - inline SQL ban
        shell: bash
        run: ./scripts/lint-inline-sql.sh
      # `-- --test-threads=1` serializes the daemon contract-test suite under
      # crates/daemon/tests/contract_daemon.rs and workspace-level tests/cli_*.rs.
      # Those suites share process-wide state — real subprocesses spawned via
      # assert_cmd, OS signal handlers, BOWERBIRD_DATA_DIR file fixtures, and
      # (since Story 3.3) BOWERBIRD_KEYRING_BACKEND keychain backends. Parallel
      # execution causes hangs (observed in Stories 1.6, 2.5, 3.1, 3.2, 3.3).
      # See docs/bmad/planning-artifacts/architecture.md "Contract-test
      # serialization (operational note)" for the full rationale (Epic 2 retro
      # AI-3 / Discovery #3). Cost: ~60-90s additional wall-clock; that is the
      # price for eliminating an entire class of flake source.
      - run: cargo test --workspace -- --test-threads=1

  typecheck-examples:
    name: Typecheck TypeScript examples (tsc --noEmit)
    # Story 5.4 / AC #3. Story 4.2's smoke test (`tests/cli_examples.rs`)
    # exercises the examples via `node --experimental-strip-types` — that
    # catches runtime regressions but lets type errors that don't manifest at
    # runtime slip through. This job runs each example's existing `typecheck`
    # script (`tsc --noEmit`) as a peer job so a TS-only failure is visible
    # in the GitHub PR status separately from the Rust workspace tests.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.6'
      - name: Verify Node version (>=22.6 required for --experimental-strip-types)
        shell: bash
        run: node --version | grep -E '^v22\.[6-9]|^v22\.[1-9][0-9]+|^v2[3-9]|^v[3-9]'
      - name: Typecheck each example
        shell: bash
        run: |
          set -euxo pipefail
          for d in examples/*/; do
            (cd "$d" && npm ci && npm run typecheck)
          done

  shim-bench-gate:
    name: Shim hot-path bench (p99 ≤ 5ms, +15% regression fails)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            baseline: macos.json
          - os: ubuntu-latest
            baseline: linux.json
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build shim under release-shim profile
        run: cargo build --profile release-shim -p bowerbird-shim

      - name: Run hot-path bench (per-invocation timings → summary JSON)
        run: cargo bench --profile release-shim -p bowerbird-shim --bench hot_path

      - name: Gate current p99 (absolute 5ms + 15% vs committed baseline)
        shell: bash
        run: |
          python3 scripts/check-shim-bench-p99.py \
            target/shim-bench-summary.json \
            crates/shim/benches/baselines/${{ matrix.baseline }}

      - name: Upload bench summary (for baseline seeding)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shim-bench-${{ matrix.os }}
          path: target/shim-bench-summary.json
          if-no-files-found: warn

  daemon-bench-gate:
    name: Daemon hook→presenter bench (p99 ≤ 100ms, +30% regression fails)
    # Story 4.4 / AC #7. End-to-end p99 hook→presenter (Unix ingest → broadcast
    # hub → WS frame) gated against per-platform baselines + the NFR2 absolute
    # 100ms ceiling. Four shapes: solo, fanout3, burst, steady-state.
    # Structurally identical to shim-bench-gate; same artifact-upload pattern
    # for baseline seeding. The 30% regression ratio is looser than the shim's
    # 15% per Axiom 3 (daemon-internal perf is soft) but tight enough to be a
    # real signal.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            baseline: macos.json
          - os: ubuntu-latest
            baseline: linux.json
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build daemon under release profile
        run: cargo build --release -p bowerbird-daemon

      - name: Run hook→presenter bench (subprocess daemon, 4 shapes)
        run: cargo bench -p bowerbird-daemon --bench hook_to_presenter

      - name: Gate current p99 across all four shapes
        shell: bash
        run: |
          python3 scripts/check-daemon-bench-p99.py \
            target/daemon-bench-summary.json \
            crates/daemon/benches/baselines/${{ matrix.baseline }}

      - name: Upload bench summary (for baseline seeding)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daemon-bench-${{ matrix.os }}
          path: target/daemon-bench-summary.json
          if-no-files-found: warn
