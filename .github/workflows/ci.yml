name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --workspace -- -D warnings
      - name: Lint - connection factory enforcement
        shell: bash
        run: ./scripts/lint-connection-factory.sh
      - name: Lint - inline SQL ban
        shell: bash
        run: ./scripts/lint-inline-sql.sh
      - run: cargo test --workspace
