name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.6'
      - name: Verify Node version (>=22.6 required for --experimental-strip-types)
        shell: bash
        run: node --version | grep -E '^v22\.[6-9]|^v22\.[1-9][0-9]+|^v2[3-9]|^v[3-9]'
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --workspace -- -D warnings
      # taskwarrior 21fa8e4f / Story 5.12 rc1: x86_64-apple-darwin only ever
      # built at tag time and failed with E0463 (target not added to the
      # pinned toolchain). Check it per-PR so cross-compile breakage cannot
      # hide until release. `rustup target add` run in the repo dir applies to
      # the rust-toolchain.toml pin, same as release.yml's load-bearing step.
      - name: Add x86_64-apple-darwin to the pinned toolchain
        if: matrix.os == 'macos-latest'
        run: rustup target add x86_64-apple-darwin
      - name: Cross-target check (x86_64-apple-darwin)
        if: matrix.os == 'macos-latest'
        run: cargo check --workspace --target x86_64-apple-darwin
      - name: Lint - connection factory enforcement
        shell: bash
        run: ./scripts/lint-connection-factory.sh
      - name: Lint - inline SQL ban
        shell: bash
        run: ./scripts/lint-inline-sql.sh
      - name: Test the scripts/ helpers (bench-gate wrapper, File List audit)
        shell: bash
        run: python3 -m unittest discover scripts/tests
      # Parallel (libtest default threads) since 2026-07-29. The Epic 2 retro
      # AI-3 `--test-threads=1` serialization is retired: the env-mutating
      # auth tests now inject a TokenEnv snapshot instead of set_var, daemons
      # bind ephemeral ports, and every suite isolates state under a per-test
      # TempDir. Verified by repeated full-workspace soaks at 16 threads on
      # 10 cores; the one flake surfaced (SIGTERM-before-handler-registration)
      # was a real daemon startup race, fixed in main.rs. If parallel runs
      # hang or flake here, capture the run log before serializing anything —
      # see docs/bmad/planning-artifacts/architecture.md "Contract-test
      # serialization (operational note)" for this history.
      - run: cargo test --workspace

  typecheck-examples:
    name: Typecheck TypeScript examples (tsc --noEmit)
    # Story 5.4 / AC #3. Story 4.2's smoke test (`tests/cli_examples.rs`)
    # exercises the examples via `node --experimental-strip-types` — that
    # catches runtime regressions but lets type errors that don't manifest at
    # runtime slip through. This job runs each example's existing `typecheck`
    # script (`tsc --noEmit`) as a peer job so a TS-only failure is visible
    # in the GitHub PR status separately from the Rust workspace tests.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.6'
      - name: Verify Node version (>=22.6 required for --experimental-strip-types)
        shell: bash
        run: node --version | grep -E '^v22\.[6-9]|^v22\.[1-9][0-9]+|^v2[3-9]|^v[3-9]'
      - name: Typecheck and unit-test each example
        shell: bash
        run: |
          set -euxo pipefail
          for d in docs/cookbook/*/; do
            # Non-npm subdirs (images/, shared/, drafts/) are legitimate in a
            # docs tree; only Node entry dirs get typechecked. The structural
            # guards (tests/cli_examples_drift.rs) keep real entries honest.
            [ -f "$d/package.json" ] || continue
            # `npm test --if-present` is not optional polish. Before it, an
            # entry's tests/ sidecar ran NOWHERE in CI: the Rust smoke
            # (tests/cli_examples.rs) exercises the entry end to end but never
            # invokes npm, and this job ran typecheck only. session-glance's
            # tests/glance.test.ts is the sole executable statement of the
            # canonical deriveRepo contract, and it was dead weight.
            # `--if-present` so an entry with no test script is still fine;
            # tests/cli_examples_drift.rs::entry_tests_are_wired_to_npm_test
            # is what stops an entry from having tests this never runs.
            (cd "$d" && npm ci && npm run typecheck && npm test --if-present)
          done

  shim-bench-gate:
    # Per-platform policy (absolute budget + regression ratio) lives in the
    # committed baseline files (crates/shim/benches/baselines/<platform>.json,
    # ADR 0003), the job name deliberately does not restate numbers that
    # drift. Best-of-2: a policy failure earns exactly one re-measure
    # (Story 5.18); tooling failures and bench crashes do not retry.
    name: Shim hot-path bench gate (per-platform policy in baselines + ADR 0003)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            baseline: macos.json
          - os: ubuntu-latest
            baseline: linux.json
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # taskwarrior 092e0a44: without a cache every run rebuilds the full dep
      # graph from scratch for a bench measured in seconds. rust-cache's
      # default key includes the job id and Cargo.lock hash, so the two bench
      # jobs (different profiles) and the test job never share entries. The
      # bench binaries themselves still rebuild; only deps are cached, so the
      # measured numbers are unaffected.
      - uses: Swatinem/rust-cache@v2

      - name: Build shim under release-shim profile
        run: cargo build --profile release-shim -p bowerbird-shim

      - name: Bench + gate (best-of-2 re-measure on policy failure)
        shell: bash
        run: |
          python3 scripts/run-bench-gate.py \
            --bench "cargo bench --profile release-shim -p bowerbird-shim --bench hot_path" \
            --gate "python3 scripts/check-shim-bench-p99.py target/shim-bench-summary.json crates/shim/benches/baselines/${{ matrix.baseline }}" \
            --summary target/shim-bench-summary.json

      - name: Upload bench summaries (final + attempt-1 on retry, for baseline seeding)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shim-bench-${{ matrix.os }}
          path: target/*bench-summary*.json
          if-no-files-found: warn

  daemon-bench-gate:
    # Story 4.4 / AC #7. End-to-end p99 hook→presenter (Unix ingest → broadcast
    # hub → WS frame) gated per shape (solo, fanout3, burst, steady) against
    # per-platform policy committed in the baseline files
    # (crates/daemon/benches/baselines/<platform>.json), the job name
    # deliberately does not restate numbers that drift. Structurally identical
    # to shim-bench-gate: same wrapper, same best-of-2 retry contract, same
    # artifact-upload pattern for baseline seeding (Story 5.18).
    name: Daemon hook→presenter bench gate (per-platform policy in baselines)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            baseline: macos.json
          - os: ubuntu-latest
            baseline: linux.json
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # taskwarrior 092e0a44: without a cache every run rebuilds the full dep
      # graph from scratch for a bench measured in seconds. rust-cache's
      # default key includes the job id and Cargo.lock hash, so the two bench
      # jobs (different profiles) and the test job never share entries. The
      # bench binaries themselves still rebuild; only deps are cached, so the
      # measured numbers are unaffected.
      - uses: Swatinem/rust-cache@v2

      - name: Build daemon under release profile
        run: cargo build --release -p bowerbird-daemon

      - name: Bench + gate (best-of-2 re-measure on policy failure)
        shell: bash
        run: |
          python3 scripts/run-bench-gate.py \
            --bench "cargo bench -p bowerbird-daemon --bench hook_to_presenter" \
            --gate "python3 scripts/check-daemon-bench-p99.py target/daemon-bench-summary.json crates/daemon/benches/baselines/${{ matrix.baseline }}" \
            --summary target/daemon-bench-summary.json

      - name: Upload bench summaries (final + attempt-1 on retry, for baseline seeding)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daemon-bench-${{ matrix.os }}
          path: target/*bench-summary*.json
          if-no-files-found: warn
