name: Release

# Two-stage release pipeline:
#
#   1. `build` matrix — three target triples (macOS arm64, macOS x86_64 via
#      cross-compile, Linux x86_64 glibc 2.35+). Each entry runs TWO cargo
#      invocations per matrix row: one for the workspace minus the shim under
#      the default `release` profile, and one for `bowerbird-shim` alone under
#      the `release-shim` profile (panic=abort, lto=fat, codegen-units=1,
#      opt-level=z, strip=true) so the shipped shim preserves the p99 ≤5ms
#      hot-path budget the CI bench gates against. The two cargo runs are
#      necessary because cargo lacks per-target-per-binary profile selection
#      in a single invocation.
#
#   2. `release` job — downloads all matrix artifacts, creates (or updates)
#      the GitHub Release for the triggering tag, attaches the three tarballs,
#      and renders the release-notes template that names the artifacts and
#      restates the musl-deferral statement verbatim (AC #2).
#
# Trigger: tag push matching `v*.*.*` OR manual `workflow_dispatch` against an
# existing tag (useful for iterating on the workflow itself without re-pushing
# refs).
#
# Third-party action audit (V1; SHA-pinning is V2 supply-chain hardening):
#   - actions/checkout@v4              first-party
#   - dtolnay/rust-toolchain@stable    curated, widely used in Rust GH Actions
#   - actions/upload-artifact@v4       first-party
#   - actions/download-artifact@v4     first-party
#   - softprops/action-gh-release@v2   battle-tested release-attachment action;
#                                      resolves release-id race a hand-rolled
#                                      `gh release create || gh release upload`
#                                      would re-introduce.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.0)'
        required: true

permissions:
  contents: write  # required for softprops/action-gh-release to create releases

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64 (Apple Silicon) — native build on the default
          # `macos-latest` runner (currently ARM).
          - target: aarch64-apple-darwin
            runner: macos-latest
            cross: false
          # macOS x86_64 (Intel) — cross-compiled from the ARM runner via
          # `rustup target add x86_64-apple-darwin`. GitHub phased out
          # Intel-based macOS runners; cross-compilation is the supported
          # path. The resulting binary runs on Intel Macs (or under Rosetta 2
          # on ARM Macs).
          - target: x86_64-apple-darwin
            runner: macos-latest
            cross: false
          # Linux x86_64 glibc. Pinned to `ubuntu-22.04` (glibc 2.35) NOT
          # `ubuntu-latest` (which floats to 24.04 = glibc 2.39 and would
          # exclude Debian 12 and older LTS distros). musl Linux is deferred
          # post-V1 (NFR9) — see the release-notes template below.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            cross: false
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        # The `@stable` ref IS the toolchain selection, so this installs
        # stable and adds `targets` to *stable* — it does NOT read
        # rust-toolchain.toml. Since that file pins channel = 1.94.1,
        # rustup switches toolchains the moment cargo runs, and the target
        # added here would be on a toolchain nothing uses. See the next
        # step; do not drop it.
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add cross-compilation target to the pinned toolchain
        # Runs with the repo as cwd, so rustup resolves the toolchain via
        # rust-toolchain.toml (1.94.1) and adds the target THERE. This is
        # the step that actually makes `--target` work.
        #
        # Only load-bearing for the one matrix row that genuinely
        # cross-compiles (x86_64-apple-darwin on an ARM runner); a no-op
        # where target == host. That asymmetry is why v0.1.0-rc1's first
        # run built 2 of 3 targets and failed the third with
        # `error[E0463]: can't find crate for core` (Story 5.12, AC #5).
        # Deliberately not pinned to a version here: it tracks whatever
        # rust-toolchain.toml says, so a channel bump needs no edit.
        run: rustup target add ${{ matrix.target }}

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          # On tag-push triggers, github.ref_name = "v0.1.0".
          # On workflow_dispatch triggers, the user supplies the tag input.
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build workspace under release profile (excl. shim)
        # The CLI binary and daemon ship under the default `release` profile.
        # `--locked` enforces the committed Cargo.lock as the dependency
        # graph (NFR10 reproducibility contract).
        run: |
          cargo build --release --workspace --locked \
            --target ${{ matrix.target }} \
            --exclude bowerbird-shim

      - name: Build shim under release-shim profile
        # The shim ships under `release-shim` (panic=abort, lto=fat,
        # codegen-units=1, opt-level=z, strip=true) so the shipped binary
        # honors the p99 ≤5ms hot-path budget. Output lands in
        # `target/<triple>/release-shim/bowerbird-shim`.
        run: |
          cargo build --profile release-shim --locked \
            --target ${{ matrix.target }} \
            -p bowerbird-shim

      - name: Stage tarball contents
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          STAGING="staging/bowerbird-${TAG}-${{ matrix.target }}"
          mkdir -p "${STAGING}/bin"
          mkdir -p "${STAGING}/adapters/claude"

          cp "target/${{ matrix.target }}/release/bowerbird"          "${STAGING}/bin/"
          cp "target/${{ matrix.target }}/release/bowerbird-daemon"   "${STAGING}/bin/"
          cp "target/${{ matrix.target }}/release-shim/bowerbird-shim" "${STAGING}/bin/"
          cp adapters/claude/tool-reactions.toml                      "${STAGING}/adapters/claude/"

          cp LICENSE        "${STAGING}/"
          cp LICENSE-MIT    "${STAGING}/"
          cp LICENSE-APACHE "${STAGING}/"
          cp README.md      "${STAGING}/"
          cp INSTALL.md     "${STAGING}/"
          cp docs/protocol-changelog.md "${STAGING}/CHANGELOG.md"

          ls -lR "${STAGING}"

      - name: Create tarball
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          NAME="bowerbird-${TAG}-${{ matrix.target }}"
          tar -czvf "${NAME}.tar.gz" -C staging "${NAME}"
          # Compute SHA-256 for the release notes (helpful for users
          # validating their download integrity).
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          else
            sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          fi
          ls -l "${NAME}.tar.gz" "${NAME}.tar.gz.sha256"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: bowerbird-${{ steps.tag.outputs.tag }}-${{ matrix.target }}
          path: |
            bowerbird-${{ steps.tag.outputs.tag }}-${{ matrix.target }}.tar.gz
            bowerbird-${{ steps.tag.outputs.tag }}-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  cross-version-test:
    # Story 4.4 / AC #5. Verifies that the current-tree daemon binary can take
    # over a data directory written by the prior tagged release without losing
    # state or breaking additive-compat on the REST surface.
    #
    # Runs on the release-pipeline lane ONLY (not per-PR). The test installs
    # the prior tag via `cargo install --git . --tag <prior>` which is slow
    # (~30s) and we don't want to pay that cost on every PR. The per-PR lane
    # runs the protocol-changelog gate + v1.0 compat corpus + contract
    # inventory; those are fast and catch most regressions.
    #
    # Until v0.1.0 actually ships and there IS a prior tag, the test SKIPs
    # cleanly (the `BOWERBIRD_PRIOR_VERSION_BINARY` env var still set, but the
    # `cargo install` step finds no such tag → empty install dir → test SKIPs
    # with a clear message). The job result stays green either way; the gate
    # becomes load-bearing once v0.1.x has shipped.
    name: Cross-version protocol upgrade (vN → vN+1)
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            triple: aarch64-apple-darwin
          - runner: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      # `fetch-depth: 0` is load-bearing for THIS job specifically, and it is
      # the whole reason the rc2 run of this job was a no-op. `actions/checkout`
      # defaults to a shallow fetch that brings NO tags, so `git tag` below saw
      # only the tag being built, `grep -v` stripped it, and PRIOR_TAG resolved
      # empty. The job then took the "no prior tag" branch and reported green,
      # so the gate looked healthy while testing nothing. Full history is also
      # required by the `cargo install --git . --tag` step, which needs the prior
      # tag's objects present locally, not just its ref.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve prior tag (one minor below the current release)
        id: prior
        shell: bash
        run: |
          # On the release-pipeline lane, the current tag is the one the
          # release was triggered for. We pick the most-recent v* tag that is
          # NOT the current one (i.e., the prior release). If none exist yet
          # (v0.1.0 = first release), emit an empty string and the install
          # step will skip.
          set -euo pipefail
          if [ -n "${{ inputs.tag }}" ]; then
            CURRENT_TAG="${{ inputs.tag }}"
          else
            CURRENT_TAG="${{ github.ref_name }}"
          fi
          # `git tag --sort=-v:refname` returns tags in semver-descending
          # order. Skip the current one and take the next.
          PRIOR_TAG=$(git tag --sort=-v:refname --list 'v*.*.*' | grep -v "^${CURRENT_TAG}$" | head -n1 || true)
          echo "current=${CURRENT_TAG}" >> "$GITHUB_OUTPUT"
          echo "prior=${PRIOR_TAG}" >> "$GITHUB_OUTPUT"
          echo "Current tag: ${CURRENT_TAG}"
          echo "Prior tag:   ${PRIOR_TAG:-<none — this is v0.1.0 or earlier>}"

      - name: Install prior-tag daemon binary
        if: steps.prior.outputs.prior != ''
        shell: bash
        run: |
          set -euo pipefail
          # Two corrections here, both found by running this step for the first
          # time (it had always been skipped, so none of it was ever exercised):
          #
          #   1. `--git .` is not a URL. Cargo rejects it outright with
          #      "invalid url `.`: relative URL without a base". It needs an
          #      absolute file:// URL, hence $GITHUB_WORKSPACE.
          #   2. The package must be named. This is a workspace with three
          #      binary-bearing packages, so `--bin bowerbird-daemon` alone gets
          #      "multiple packages with binaries found: bowerbird,
          #      bowerbird-daemon, bowerbird-shim".
          #
          # Verified locally against v0.1.0-rc1 before this landed: installs the
          # prior daemon, and the upgrade test then passes in ~60ms (fast because
          # daemon startup is milliseconds; confirmed non-vacuous by pointing the
          # env var at a non-daemon binary and watching it fail on the 10s
          # socket-bind guard).
          cargo install \
            --git "file://${GITHUB_WORKSPACE}" \
            --tag "${{ steps.prior.outputs.prior }}" \
            bowerbird-daemon \
            --root "target/cross-version-installs/${{ steps.prior.outputs.prior }}" \
            --bin bowerbird-daemon --locked

      - name: Run cross-version upgrade test
        if: steps.prior.outputs.prior != ''
        shell: bash
        env:
          BOWERBIRD_RUN_CROSS_VERSION_TEST: '1'
          BOWERBIRD_PRIOR_VERSION_BINARY: target/cross-version-installs/${{ steps.prior.outputs.prior }}/bin/bowerbird-daemon
        run: |
          cargo test --test cross_version_upgrade --locked -- --test-threads=1 --nocapture

      - name: SKIP message (no prior tag)
        if: steps.prior.outputs.prior == ''
        run: |
          # Deliberately a WARNING, not a notice, and deliberately does not
          # assert why. A prior tag exists from v0.1.0-rc2 onward, so from here
          # on an empty PRIOR_TAG means something is wrong with tag resolution
          # rather than "first release". The rc2 run printed the old reassuring
          # "expected for v0.1.0" notice while silently testing nothing, which is
          # exactly the failure this wording is meant to stop repeating.
          echo "::warning::cross-version test SKIPPED: no prior v* tag was resolved. If any v* tag other than the current one exists, this is a BUG in tag resolution (check that checkout fetched tags, i.e. fetch-depth: 0) and NOT a clean skip. Only genuinely expected before the first release exists."

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        shell: bash
        run: |
          find artifacts -type f -name '*.tar.gz*' | sort

      - name: Build release notes body
        id: notes
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # The musl-deferral paragraph (AC #2) is verbatim here; the README
          # contains the same paragraph in its Install section so a user
          # landing on either entry point sees the deferral.
          cat > release-notes.md <<EOF
          ## Prebuilt binaries

          | Target | Tarball |
          |---|---|
          | macOS arm64 (Apple Silicon) | \`bowerbird-${TAG}-aarch64-apple-darwin.tar.gz\` |
          | macOS x86_64 (Intel) | \`bowerbird-${TAG}-x86_64-apple-darwin.tar.gz\` |
          | Linux x86_64 (glibc 2.35+) | \`bowerbird-${TAG}-x86_64-unknown-linux-gnu.tar.gz\` |

          > **musl Linux is deferred post-V1** (NFR9). On musl-based distributions
          > (Alpine, Void, etc.) install from source instead:
          >
          > \`\`\`sh
          > cargo install --git https://github.com/${{ github.repository }} --tag ${TAG}
          > \`\`\`
          >
          > Windows is an explicit V1 scope cut (see \`docs/no-list.md\`).

          Each tarball contains the three binaries (\`bowerbird\`,
          \`bowerbird-shim\` under the \`release-shim\` profile,
          \`bowerbird-daemon\`), the bundled \`adapters/claude/tool-reactions.toml\`,
          MIT+Apache-2.0 license files, the project README, and \`INSTALL.md\`
          with the post-extract walkthrough.

          ## Install (prebuilt)

          See \`INSTALL.md\` inside the tarball or the
          [project README](https://github.com/${{ github.repository }}#install).

          ## Verify the download

          SHA-256 checksums are attached as \`*.sha256\` files alongside each
          tarball.

          ## macOS Gatekeeper

          The prebuilt binaries are not signed (Apple Developer ID
          certificates are deferred post-V1). On first run, macOS will block
          the binaries with a Gatekeeper warning. Clear the quarantine flag
          per the README's Install section.
          EOF
          echo "path=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: bowerbird ${{ steps.tag.outputs.tag }}
          body_path: release-notes.md
          # Treat `v0.1.0-rc1` (or any tag containing `-`) as prerelease.
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          # rc tags stage as drafts so the maintainer can verify the
          # fresh-machine install (Story 5.12 AC2) before the release goes
          # public; the tag itself still exists as soon as it's pushed.
          draft: ${{ contains(steps.tag.outputs.tag, '-') }}
          # Auto-generate the "What's Changed" section from PR history.
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.tar.gz.sha256
          fail_on_unmatched_files: true
