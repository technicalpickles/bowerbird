[package]
name    = "bowerbird-daemon"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"

[[bin]]
name = "bowerbird-daemon"
path = "src/main.rs"

[features]
# Story 3.3: `mock-keyring` exposes the in-process `keyring::mock` backend via
# `BOWERBIRD_KEYRING_BACKEND=mock`. Defaulted ON so `cargo test --workspace`
# can exercise the resolver hermetically without the developer's real keychain.
# Release distributions can build with `--no-default-features` to ensure
# production binaries never honor the `mock` env value (defense in depth: even
# a malicious env-var injection cannot neutralize keychain protection).
default = ["mock-keyring"]
mock-keyring = []

[dependencies]
protocol           = { path = "../protocol" }
adapter-claude     = { path = "../adapter-claude" }
tokio              = { workspace = true }
axum               = { workspace = true }
rusqlite           = { workspace = true }
deadpool-sqlite    = { workspace = true }
tower-http         = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true, features = ["chrono", "env-filter"] }
anyhow             = { workspace = true }
uuid               = { workspace = true }
rusqlite_migration = { workspace = true }
tokio-util         = { workspace = true }
tokio-stream       = { workspace = true }
thiserror          = { workspace = true }
tower              = { workspace = true }
clap               = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
secrecy            = { workspace = true }
subtle             = { workspace = true }
nix                = { workspace = true }
keyring            = { workspace = true }
toml               = { workspace = true }

[dev-dependencies]
tempfile          = { workspace = true }
assert_cmd        = { workspace = true }
nix               = { workspace = true }
tokio             = { workspace = true }
tower             = { workspace = true, features = ["util"] }
tokio-tungstenite = { workspace = true }
futures-util      = "0.3"
# Story 4.4 / AC #7 — `benches/hook_to_presenter.rs` reads `~/.bowerbird/server.json`.
serde             = { workspace = true }

# Story 4.4 / AC #7 — Hook→presenter p99 bench. `harness = false` per the same
# reasoning as the shim hot-path bench: Criterion's `SamplingMode::Flat`
# batches samples in our latency range and averages spikes into invisibility.
[[bench]]
name    = "hook_to_presenter"
harness = false

[lints]
workspace = true
