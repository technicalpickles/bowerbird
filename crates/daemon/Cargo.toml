version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[[bin]]
name = "bowerbird-daemon"
path = "src/main.rs"

[dependencies]
protocol           = { path = "../protocol" }
tokio              = { workspace = true }
axum               = { workspace = true }
rusqlite           = { workspace = true }
