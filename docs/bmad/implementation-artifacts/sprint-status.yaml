# last_updated: '2026-07-29 (Story 5.16 hotfix-shim-timeout-drops-events review -> in-progress. bmad-code-review ran three adversarial layers (Blind Hunter diff-only, Edge Case Hunter with project access, Acceptance Auditor with spec+context) plus reviewer verification. OUTCOME: CHANGES REQUESTED -- 10 patch items written into the story as unchecked action items, 7 deferred to deferred-work.md, 5 dismissed as noise. Nothing was auto-fixed. TWO HIGH. [1] The shipped log line says "event dropped", which is FALSE for a read timeout -- the case the story is about. handler.rs try_send-es the event before writing the reply and reads the payload out of the kernel buffer regardless of whether the shim is still there, so on a read timeout the event LANDS and only the ack is lost. The record establishes this itself in Completion Note 1 reason 3 and then ships wording that contradicts it, reusing the exact phrase Error::Connect uses where the drop IS real -- so the operator still cannot tell event-lost from ack-lost, which is the distinction this story exists to create. The new e2e test asserts both halves against each other: peer received the full payload AND log says dropped. [2] The "write + read <= 5ms" comment is still false and a new test now pins it. SO_*TIMEO bounds one syscall, not write_all''s loop; 1 MiB stdin cap vs 8192-byte net.local.stream.sendspace (verified) means worst case 2ms x ceil(len/8192) + 3ms, up to ~256ms inside Claude''s hook for a big PostToolUse payload -- the Axiom 3 trust-boundary stall. AC #4 asked for exactly this claim to be made honest; the connect omission was fixed and the larger overclaim left in. Behavior is pre-existing; the comment and the assertion are this story''s. FIVE MEDIUM: two more comments in the diff assert things the same diff disproves (socket.rs:133 still says TimedOut is "the Linux one" 90 lines under the paragraph refuting it -- commit fb3bda2 exists to fix that claim and missed this copy; error.rs justifies exit-0 with 