lly guard a future variant -- a new variant returning exit 2 would compile clean and pass all three. error.rs claims otherwise and THIS STORY IS THE PROOF (the author had to remember by hand). Pre-existing; needs an exhaustive-match or derive fix. VERIFICATION: fmt, clippy --all-targets --workspace -D warnings, scripts/test.sh 639 passed / 0 failed (636 + 3 new), log target/test-logs/20260729-201652-2824. AC5 re-verified because this pass changed the WRITE PATH not just comments: A/B against HEAD by stashing, 2 samples each on a settled machine, HEAD p99 1.384/1.370ms vs with-fix 1.268/1.403ms -- ranges overlap completely, bounded loop is neutral as predicted. Final gate -47.34% vs baseline. SECOND BENCH ARTIFACT DISCLOSED: the first post-fix reading was +61.87% (p99 4.311ms) because the bench ran immediately after scripts/test.sh; that is twice in this story that a hot_path delta misled for machine-state rather than code reasons, so the durable lesson is recorded in the story -- this bench is only meaningful on an idle machine and never straight after a test run, and a single delta should be A/B-d against a stash before it is believed. Emdashes stripped from every line this branch added, per the maintainers standing style rule (pre-existing project prose left alone). Still on branch story-5.16-shim-timeout-diagnosability / PR #28; rc1 remains an unpublished DRAFT and 5.12 remains in-progress.)'
# last_updated: '2026-07-29 (Story 5.16 code review PASS 2 -> in-progress. Independent second-pass review of the resolution work (commit 8736799 + 1185417) by a fresh bmad-code-review agent, 3 hunter layers plus reviewer verification with standalone measurement programs. OUTCOME: CHANGES REQUESTED -- 22 patch items written into the story as unchecked action items, 1 deferred, 4 dismissed as noise. Nothing was auto-fixed. Pass 1s findings were left untouched; the new section is additive. TWO HIGH, both on write_all_within, the new production function the resolution added. HIGH-1: PASS 1s HIGH-2 IS NOT ACTUALLY FIXED. SO_SNDTIMEO does not bound one write(2) either -- on macOS the kernels sosend loop re-waits per socket-buffer refill, so a single write(2) with a 2ms timeout keeps going as long as the peer drains anything. Measured on this host with the SHIPPED function, 1 MiB payload, peer draining 8 KiB per interval: 200us -> Ok in 39ms, 500us -> Ok in 96ms, 1000us -> Ok in 191ms, 1400us -> Err(Timeout) in 47.8ms, 2000us -> Err(Timeout) in 2.5ms. Every one is a SINGLE write syscall with ZERO re-arms, because the first match arm (Ok(n) if n >= buf.len()) returns without ever consulting the deadline. So the identical failure shape pass 1 flagged -- a silent multi-hundred-ms stall inside Claudes hook reporting success -- is still live at 191ms, and the storys own pre-fix repro (256 KiB / 82ms) still reproduces at 45.6ms. The claim is now asserted in six places (WRITE_BUDGET_MS doc, write_all_within doc, send() comment, Error::Timeout doc, the test name, Completion Note 8 / commit message / this file), which is strictly worse than the state pass 1 found: a false comment plus a passing test. Verified fix: cap each write(2) at the send-buffer size (buf.len().min(8192)) so the kernels internal loop cannot re-wait inside one syscall -- measured 2.03 to 2.51ms at EVERY drain rate, and a small payload still completes in one syscall (5.25us vs 6.04us, noise), so the success-path